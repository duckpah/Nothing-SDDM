[General]
# Optional wallpaper. Empty = the black dot-grid canvas with the faint orb.
# Accepts a path or file:// URL. The image is drawn as a dot matrix.
background=

# Draw the wallpaper as dots (false = plain dimmed photo).
backgroundDots=true

# 24-hour clock (false = 12-hour).
clock24=true

# Blink the clock colon and the password caret.
blink=false

# Background layers.
grid=true
orb=true

# Render avatars as dots (same matrix as the shell). false = plain photo.
avatarDots=true

# SDDM must expose every user so the avatar/name cycler works.
needsFullUserModel=true

# Colors. SDDM reads every key from [General] as config.<key>.
bg=#000000
panel=#0E0E0E
line=#2A2A2A
grey=#8C8C8C
fg=#F2F2F2
accent=#D71921
